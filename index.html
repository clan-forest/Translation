<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Translator To English</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#4285f4,#34a853);
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    background:white;
    max-width:700px;
    margin:auto;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,.25);
}

h1{
    color:#333;
}

textarea{
    width:100%;
    height:140px;
    padding:12px;
    font-size:18px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

select,button{
    width:100%;
    margin-top:10px;
    padding:12px;
    font-size:18px;
    border:none;
    border-radius:10px;
}

button{
    cursor:pointer;
    color:white;
}

.translate{
    background:#4285f4;
}

.mic{
    background:#ea4335;
}

.speak{
    background:#34a853;
}

#output{
    margin-top:20px;
    padding:15px;
    background:#f2f2f2;
    border-radius:10px;
    min-height:80px;
    text-align:left;
    color:black;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌎 Voice Translator To English</h1>

<textarea id="inputText"
placeholder="Type or speak in another language..."></textarea>

<select id="sourceLanguage">
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="it">Italian</option>
    <option value="pt">Portuguese</option>
    <option value="ja">Japanese</option>
    <option value="ko">Korean</option>
    <option value="zh-CN">Chinese</option>
    <option value="ar">Arabic</option>
    <option value="ru">Russian</option>
</select>

<button class="mic" onclick="startVoice()">
🎤 Speak
</button>

<button class="translate" onclick="translateText()">
🌍 Translate To English
</button>

<button class="speak" onclick="speakEnglish()">
🔊 Read English Translation
</button>

<div id="output">
English translation will appear here...
</div>

</div>

<script>
let englishTranslation = "";

function startVoice(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
    alert("Speech recognition is not supported.");
    return;
}

const recognition = new SpeechRecognition();

const langMap = {
    "es":"es-ES",
    "fr":"fr-FR",
    "de":"de-DE",
    "it":"it-IT",
    "pt":"pt-PT",
    "ja":"ja-JP",
    "ko":"ko-KR",
    "zh-CN":"zh-CN",
    "ar":"ar-SA",
    "ru":"ru-RU"
};

const selected =
document.getElementById("sourceLanguage").value;

recognition.lang = langMap[selected];

recognition.start();

document.getElementById("output").innerHTML =
"🎤 Listening...";

recognition.onresult = function(event){
    const text =
    event.results[0][0].transcript;

    document.getElementById("inputText").value =
    text;

    translateText();
};
}

async function translateText(){

const text =
document.getElementById("inputText").value.trim();

if(!text){
    return;
}

const source =
document.getElementById("sourceLanguage").value;

document.getElementById("output").innerHTML =
"Translating...";

try{

const url =
`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${source}|en`;

const response = await fetch(url);

const data = await response.json();

englishTranslation =
data.responseData.translatedText;

document.getElementById("output").innerHTML =
englishTranslation;

}
catch(error){

document.getElementById("output").innerHTML =
"Translation failed.";
}
}

function speakEnglish(){

if(!englishTranslation){
    return;
}

const speech =
new SpeechSynthesisUtterance(
englishTranslation
);

speech.lang = "en-US";
speech.rate = 1;
speech.pitch = 1;

window.speechSynthesis.cancel();
window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
