<!DOCTYPE html>
<html>
<head>
<title>Two-Way Voice Translator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#4285f4,#34a853);
  margin:0;
  padding:20px;
  text-align:center;
}
.box{
  background:white;
  max-width:700px;
  margin:auto;
  padding:25px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,0,0,.25);
}
textarea,select,button{
  width:100%;
  margin-top:10px;
  padding:12px;
  font-size:17px;
  border-radius:10px;
  box-sizing:border-box;
}
textarea{
  height:130px;
  border:1px solid #ccc;
}
button{
  border:none;
  color:white;
  font-weight:bold;
}
.blue{background:#4285f4;}
.red{background:#ea4335;}
.green{background:#34a853;}
.gray{background:#555;}
#output{
  margin-top:15px;
  background:#f2f2f2;
  padding:15px;
  border-radius:10px;
  min-height:70px;
  text-align:left;
  font-size:18px;
}
</style>
</head>

<body>
<div class="box">
<h1>🌎 Two-Way Voice Translator</h1>

<label>From:</label>
<select id="fromLang">
  <option value="en">English</option>
  <option value="es">Spanish</option>
  <option value="fr">French</option>
  <option value="de">German</option>
  <option value="it">Italian</option>
  <option value="pt">Portuguese</option>
  <option value="ja">Japanese</option>
  <option value="ko">Korean</option>
  <option value="zh-CN">Chinese</option>
  <option value="ar">Arabic</option>
  <option value="ru">Russian</option>
</select>

<label>To:</label>
<select id="toLang">
  <option value="es">Spanish</option>
  <option value="en">English</option>
  <option value="fr">French</option>
  <option value="de">German</option>
  <option value="it">Italian</option>
  <option value="pt">Portuguese</option>
  <option value="ja">Japanese</option>
  <option value="ko">Korean</option>
  <option value="zh-CN">Chinese</option>
  <option value="ar">Arabic</option>
  <option value="ru">Russian</option>
</select>

<button class="gray" onclick="swapLanguages()">🔁 Switch Back and Forth</button>

<textarea id="inputText" placeholder="Type or speak here..."></textarea>

<button class="red" onclick="startVoice()">🎤 Speak</button>
<button class="blue" onclick="translateText()">🌍 Translate</button>
<button class="green" onclick="speakTranslation()">🔊 Speak Translation</button>

<div id="output">Translation will appear here...</div>
</div>

<script>
let translatedText = "";

const voiceLangs = {
  "en":"en-US",
  "es":"es-ES",
  "fr":"fr-FR",
  "de":"de-DE",
  "it":"it-IT",
  "pt":"pt-PT",
  "ja":"ja-JP",
  "ko":"ko-KR",
  "zh-CN":"zh-CN",
  "ar":"ar-SA",
  "ru":"ru-RU"
};

function swapLanguages(){
  const from = document.getElementById("fromLang");
  const to = document.getElementById("toLang");
  const input = document.getElementById("inputText");
  const output = document.getElementById("output");

  const oldFrom = from.value;
  from.value = to.value;
  to.value = oldFrom;

  if(translatedText !== ""){
    input.value = translatedText;
    output.innerText = "Switched. Press Translate again.";
    translatedText = "";
  }
}

function startVoice(){
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Speech does not work in this browser. Try Safari or Chrome.");
    return;
  }

  const recognition = new SpeechRecognition();
  const from = document.getElementById("fromLang").value;

  recognition.lang = voiceLangs[from];
  recognition.start();

  document.getElementById("output").innerText = "🎤 Listening...";

  recognition.onresult = function(event){
    const spoken = event.results[0][0].transcript;
    document.getElementById("inputText").value = spoken;
    translateText();
  };

  recognition.onerror = function(){
    document.getElementById("output").innerText = "I could not hear you. Try again.";
  };
}

async function translateText(){
  const text = document.getElementById("inputText").value.trim();
  const from = document.getElementById("fromLang").value;
  const to = document.getElementById("toLang").value;
  const output = document.getElementById("output");

  if(text === ""){
    output.innerText = "Type or speak something first.";
    return;
  }

  if(from === to){
    output.innerText = text;
    translatedText = text;
    return;
  }

  output.innerText = "Translating...";

  try{
    const url =
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(text) +
      "&langpair=" + from + "|" + to;

    const response = await fetch(url);
    const data = await response.json();

    translatedText = data.responseData.translatedText;
    output.innerText = translatedText;
  }
  catch(error){
    output.innerText = "Translation failed. Check your internet.";
  }
}

function speakTranslation(){
  if(translatedText.trim() === ""){
    return;
  }

  const to = document.getElementById("toLang").value;

  const speech = new SpeechSynthesisUtterance();
  speech.text = translatedText;
  speech.lang = voiceLangs[to];
  speech.rate = 0.9;
  speech.pitch = 1;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);
}
</script>
</body>
</html>
