<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Translator</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#4285f4,#34a853);
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(0,0,0,.25);
}

h1{
    text-align:center;
}

select,textarea,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    font-size:17px;
    box-sizing:border-box;
}

textarea{
    height:140px;
    resize:vertical;
}

button{
    border:none;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.translate{background:#4285f4;}
.voice{background:#ea4335;}
.speak{background:#34a853;}
.swap{background:#555;}

#result{
    margin-top:15px;
    background:#f2f2f2;
    padding:15px;
    border-radius:10px;
    min-height:80px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌍 Ultimate Translator</h1>

<label><b>Translate From:</b></label>
<select id="fromLang">
<option value="en">English</option>
<option value="es">Spanish</option>
<option value="fr">French</option>
<option value="de">German</option>
<option value="it">Italian</option>
<option value="pt">Portuguese</option>
<option value="ja">Japanese</option>
<option value="ko">Korean</option>
<option value="zh-CN">Chinese</option>
<option value="ar">Arabic</option>
<option value="ru">Russian</option>
</select>

<label><b>Translate To:</b></label>
<select id="toLang">
<option value="es">Spanish</option>
<option value="en">English</option>
<option value="fr">French</option>
<option value="de">German</option>
<option value="it">Italian</option>
<option value="pt">Portuguese</option>
<option value="ja">Japanese</option>
<option value="ko">Korean</option>
<option value="zh-CN">Chinese</option>
<option value="ar">Arabic</option>
<option value="ru">Russian</option>
</select>

<button class="swap" onclick="swapLanguages()">
🔁 Swap Languages
</button>

<textarea id="inputText" placeholder="Type or speak here..."></textarea>

<button class="voice" onclick="startVoice()">
🎤 Speak
</button>

<button class="translate" onclick="translateText()">
🌍 Translate
</button>

<button class="speak" onclick="speakResult()">
🔊 Speak Translation
</button>

<div id="result">
Translation will appear here...
</div>

</div>

<script>
let translatedText = "";

const voices = {
  en:"en-US",
  es:"es-ES",
  fr:"fr-FR",
  de:"de-DE",
  it:"it-IT",
  pt:"pt-PT",
  ja:"ja-JP",
  ko:"ko-KR",
  "zh-CN":"zh-CN",
  ar:"ar-SA",
  ru:"ru-RU"
};

function swapLanguages(){
  let from = document.getElementById("fromLang");
  let to = document.getElementById("toLang");

  let temp = from.value;
  from.value = to.value;
  to.value = temp;

  document.getElementById("inputText").value = translatedText;
}

function startVoice(){

  const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

  if(!SpeechRecognition){
      alert("Speech recognition is not supported.");
      return;
  }

  const recognition = new SpeechRecognition();

  const from =
  document.getElementById("fromLang").value;

  recognition.lang = voices[from];

  recognition.start();

  document.getElementById("result").innerHTML =
  "🎤 Listening...";

  recognition.onresult = function(event){

      const text =
      event.results[0][0].transcript;

      document.getElementById("inputText").value =
      text;

      translateText();
  };
}

async function translateText(){

  const text =
  document.getElementById("inputText").value.trim();

  const from =
  document.getElementById("fromLang").value;

  const to =
  document.getElementById("toLang").value;

  if(text === ""){
      return;
  }

  document.getElementById("result").innerHTML =
  "Translating...";

  try{

      const response = await fetch(
      "https://api.mymemory.translated.net/get?q=" +
      encodeURIComponent(text) +
      "&langpair=" + from + "|" + to
      );

      const data = await response.json();

      translatedText =
      data.responseData.translatedText;

      document.getElementById("result").innerHTML =
      translatedText;

  }catch(e){

      document.getElementById("result").innerHTML =
      "Translation failed.";
  }
}

function speakResult(){

  if(!translatedText) return;

  const to =
  document.getElementById("toLang").value;

  const speech =
  new SpeechSynthesisUtterance(translatedText);

  speech.lang = voices[to];

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);
}
</script>

</body>
</html>
