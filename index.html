<!DOCTYPE html>
<html>
<head>
  <title>Talking Translation Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4285f4, #34a853);
      color: white;
      text-align: center;
      padding: 25px;
    }

    .box {
      background: white;
      color: black;
      max-width: 650px;
      margin: auto;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    textarea, select, button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      background: #4285f4;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2b6cdf;
    }

    .mic {
      background: #ea4335;
    }

    .speak {
      background: #34a853;
    }

    #output {
      margin-top: 20px;
      background: #f1f1f1;
      padding: 15px;
      border-radius: 10px;
      min-height: 50px;
      text-align: left;
      color: black;
    }
  </style>
</head>
<body>

  <h1>🌍 Talking Translator</h1>

  <div class="box">
    <textarea id="text" rows="5" placeholder="Type or speak something in English..."></textarea>

    <button class="mic" onclick="startListening()">🎤 Talk to it</button>

    <select id="language">
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="it">Italian</option>
      <option value="pt">Portuguese</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="zh-CN">Chinese</option>
      <option value="ar">Arabic</option>
      <option value="ru">Russian</option>
    </select>

    <button onclick="translateText()">Translate</button>
    <button class="speak" onclick="speakTranslation()">🔊 Speak out loud</button>

    <div id="output">Translation will appear here...</div>
  </div>

  <script>
    let translatedText = "";

    async function translateText() {
      const text = document.getElementById("text").value;
      const language = document.getElementById("language").value;
      const output = document.getElementById("output");

      if (text.trim() === "") {
        output.innerText = "Please type or say something first.";
        return;
      }

      output.innerText = "Translating...";

      try {
        const url = "https://api.mymemory.translated.net/get?q="
          + encodeURIComponent(text)
          + "&langpair=en|"
          + language;

        const response = await fetch(url);
        const data = await response.json();

        translatedText = data.responseData.translatedText;
        output.innerText = translatedText;

        speakTranslation();

      } catch (error) {
        output.innerText = "Translation failed. Check your internet connection.";
      }
    }

    function startListening() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        alert("Speech recognition does not work in this browser. Try Chrome or Safari.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.start();

      document.getElementById("output").innerText = "Listening...";

      recognition.onresult = function(event) {
        const spokenText = event.results[0][0].transcript;
        document.getElementById("text").value = spokenText;
        translateText();
      };

      recognition.onerror = function() {
        document.getElementById("output").innerText = "I could not hear you. Try again.";
      };
    }

    function speakTranslation() {
      if (translatedText.trim() === "") {
        return;
      }

      const language = document.getElementById("language").value;

      const speech = new SpeechSynthesisUtterance();
      speech.text = translatedText;
      speech.lang = language;
      speech.rate = 0.9;
      speech.pitch = 1;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(speech);
    }
  </script>

</body>
</html>
